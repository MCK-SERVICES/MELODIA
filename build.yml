name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'application
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Melodia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Melodia-apk
          path: Melodia.apk

      - name: Publier l'APK (téléchargement direct)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" Melodia.apk \
            --title "Mélodia – version ${{ github.run_number }}" \
            --notes "Télécharge Melodia.apk depuis ton téléphone et installe-le."
