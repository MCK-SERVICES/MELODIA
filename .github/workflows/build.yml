name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'application
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # En cas d'échec, les erreurs sont affichées sur la page du build
      - name: Afficher les erreurs
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E '^e: ' build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            msg=$(grep -A12 'What went wrong' build.log | head -14 | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -n "$msg" ]; then echo "::error title=Gradle::$msg"; fi
          fi

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Scanix.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Scanix-apk
          path: Scanix.apk

      - name: Publier l'APK (téléchargement direct)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" Scanix.apk \
            --title "Scanix – version ${{ github.run_number }}" \
            --notes "Télécharge Scanix.apk depuis ton téléphone et installe-le."
