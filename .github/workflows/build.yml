name: Construire l'APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Les fichiers peuvent être envoyés « à plat » sur GitHub :
      # cette étape les range automatiquement dans les bons dossiers.
      - name: Ranger les fichiers dans les bons dossiers
        run: |
          shopt -s nullglob
          M=app/src/main
          mkdir -p $M/java $M/res/values $M/res/drawable $M/res/mipmap-anydpi-v26 gradle/wrapper
          for f in *.kt; do
            pkg=$(grep -m1 '^package ' "$f" | awk '{print $2}' | tr -d ';\r')
            if [ -n "$pkg" ]; then d=$M/java/${pkg//.//}; mkdir -p "$d"; mv -f "$f" "$d/"; fi
          done
          if [ -f AndroidManifest.xml ]; then mv -f AndroidManifest.xml $M/; fi
          for f in *.xml; do
            if grep -q '<resources' "$f"; then mv -f "$f" $M/res/values/
            elif grep -q '<adaptive-icon' "$f"; then mv -f "$f" $M/res/mipmap-anydpi-v26/
            elif grep -q '<vector' "$f"; then mv -f "$f" $M/res/drawable/
            fi
          done
          for f in build.gradle*.kts; do
            if grep -q 'android {' "$f"; then mv -f "$f" app/build.gradle.kts
            elif grep -q 'apply false' "$f"; then mv -f "$f" "$RUNNER_TEMP/root.gradle.kts"
            fi
          done
          if [ -f "$RUNNER_TEMP/root.gradle.kts" ]; then mv -f "$RUNNER_TEMP/root.gradle.kts" build.gradle.kts; fi
          for f in gradle-wrapper*.jar gradle-wrapper*.properties; do
            case "$f" in *.jar) mv -f "$f" gradle/wrapper/gradle-wrapper.jar ;; *) mv -f "$f" gradle/wrapper/gradle-wrapper.properties ;; esac
          done
          chmod +x gradlew
          find . -path ./.git -prune -o -type f -print | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'application
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      # En cas d'échec, les erreurs sont affichées sur la page du build
      - name: Afficher les erreurs
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -E '^e: ' build.log | head -10 | while IFS= read -r l; do echo "::error::$l"; done
            msg=$(grep -A12 'What went wrong' build.log | head -14 | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -n "$msg" ]; then echo "::error title=Gradle::$msg"; fi
          fi

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Melodia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Melodia-apk
          path: Melodia.apk

      - name: Publier l'APK (téléchargement direct)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" Melodia.apk \
            --title "Mélodia – version ${{ github.run_number }}" \
            --notes "Télécharge Melodia.apk depuis ton téléphone et installe-le."
